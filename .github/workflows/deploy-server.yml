name: Deploy order server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (prices, add-on rules, order flow)
        run: node --no-warnings server/test/run.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the Cloudflare secrets are set
        id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          P: ${{ secrets.STAFF_PIN }}
        run: |
          missing=""
          [ -z "$T" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$A" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$P" ] && missing="$missing STAFF_PIN"
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed yet. Missing repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            STAFF_PIN
        env:
          STAFF_PIN: ${{ secrets.STAFF_PIN }}
