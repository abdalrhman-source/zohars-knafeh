<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E2D32">
<meta name="robots" content="noindex">
<title>מסך הזמנות · הכנאפה של זוהר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--bg:#2E2D32;--card:#3A393F;--line:#4B4A51;--ink:#F2EFE8;--muted:#ABA8B0;--gold:#D1B06D;--green:#7FB069}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Heebo","Tajawal",system-ui,sans-serif;min-height:100vh}
  header{position:sticky;top:0;z-index:5;background:#242328;border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;font-weight:800}
  h1 small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:6px}
  .counts{display:flex;gap:8px;margin-inline-start:auto}
  .chip{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .chip b{color:var(--gold)}
  button{font:inherit;cursor:pointer}
  .snd{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold)}
  .snd.on{background:var(--gold);color:#2B2A2E}
  .demo{margin:12px 16px 0;padding:9px 14px;border-radius:12px;background:var(--gold);color:#2B2A2E;font-size:13px;font-weight:700;text-align:center}
  main{padding:14px 16px 40px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-items:start}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:16px}
  .ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .ord.new{border-color:var(--gold);box-shadow:0 0 0 2px rgba(209,176,109,.35)}
  .ord.ready{border-color:var(--green)}
  .top{display:flex;align-items:baseline;gap:10px}
  .no{font-size:28px;font-weight:800;color:var(--gold)}
  .ord.ready .no{color:var(--green)}
  .tm{font-size:13px;color:var(--muted)}
  .badge{margin-inline-start:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(209,176,109,.18);color:var(--gold)}
  .ord.ready .badge{background:rgba(127,176,105,.2);color:#B9E0A5}
  .who{font-size:14px;color:var(--muted)}
  .who a{color:var(--ink)}
  .ln{border-top:1px dashed var(--line);padding-top:8px}
  .ln .nm{font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .ln .op{font-size:13.5px;color:var(--muted);padding-inline-start:12px}
  .note{font-size:14px;background:rgba(209,176,109,.12);border-radius:10px;padding:7px 10px}
  .paid{font-size:12px;font-weight:800;color:#B9E0A5;background:rgba(127,176,105,.2);border-radius:999px;padding:2px 8px;margin-inline-start:8px}
  .unpaid{font-size:12px;font-weight:800;color:#2B2A2E;background:#E8B04B;border-radius:999px;padding:2px 8px;margin-inline-start:8px}
  .bitok{background:#0FB8C2;color:#fff}
  .ord.wait{border-color:#E8B04B;box-shadow:0 0 0 2px rgba(232,176,75,.35)}
  .sec{grid-column:1/-1;font-size:17px;font-weight:800;margin-top:4px}
  .sec small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .wait-h{color:#E8B04B}
  .wbadge{background:rgba(232,176,75,.2)!important;color:#E8B04B!important}
  .wchip b{color:#E8B04B}
  .hint{font-size:13px;color:#E8B04B}
  .cancel{background:transparent;border:1px solid #8a4b4b!important;color:#E8A0A0;flex:0 0 auto!important}
  .tot{display:flex;justify-content:space-between;font-weight:800;border-top:1px solid var(--line);padding-top:8px}
  .acts{display:flex;gap:8px;margin-top:4px}
  .acts button{flex:1;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800}
  .rdy{background:var(--green);color:#16240F}
  .dn{background:transparent;border:1px solid var(--line)!important;color:var(--ink)}
  .undo{background:transparent;border:1px solid var(--line)!important;color:var(--muted);font-size:13px!important;flex:0 0 auto!important;padding:12px 14px!important}
  .demo[hidden],.net[hidden],.login[hidden]{display:none}
  .net{margin:12px 16px 0;padding:9px 14px;border-radius:12px;background:#8a3b3b;color:#fff;font-size:13px;font-weight:700;text-align:center}
  .login{max-width:360px;margin:60px auto;padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;gap:12px;text-align:center}
  .login h2{font-size:17px}
  .login input{font:inherit;font-size:22px;letter-spacing:6px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .login button{font:inherit;font-size:16px;font-weight:800;padding:12px;border:0;border-radius:12px;background:var(--gold);color:#2B2A2E;cursor:pointer}
  .lerr{color:#E8A0A0;font-size:14px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>הזמנות · الطلبات <small>הכנאפה של זוהר</small></h1>
  <div class="counts"><span class="chip wchip">ממתין לתשלום · بانتظار الدفع <b id="cWait">0</b></span><span class="chip">בהכנה · عم يتحضّر <b id="cPrep">0</b></span><span class="chip">מוכן · جاهز <b id="cReady">0</b></span></div>
  <button type="button" class="snd" id="snd">🔔 צליל · صوت</button>
</header>
<div class="demo" id="demo">גרסת ניסיון · עובד רק באותו מכשיר שבו נשלחה ההזמנה · نسخة تجربة: بتشتغل بس على نفس الجهاز اللي انبعت منه الطلب</div>
<div class="net" id="net" hidden>אין חיבור לשרת · ما في اتصال بالسيرفر</div>
<form class="login" id="login" hidden>
  <h2>כניסה למסך ההזמנות · الدخول لشاشة الطلبات</h2>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="קוד · الكود" maxlength="12" required>
  <button type="submit">כניסה · دخول</button>
  <div class="lerr" id="lerr"></div>
</form>
<main id="list"></main>
<script>
const API = "https://zohars-knafeh-orders.abdalrhmanmanasra11.workers.dev";
const LIVE = !!API;
const LOCAL_KEY = "zk-orders2", TOKEN_KEY = "zk-staff-token";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const PAYN = {apple:"Apple Pay", google:"Google Pay", card:"אשראי", bit:"ביט"};
const NEXT = {paid: {from: ["awaiting_payment"], to: "new", paid: true}, cancel: {from: ["awaiting_payment", "new"], to: "cancelled"},
              ready: {from: ["new"], to: "ready"}, reopen: {from: ["ready"], to: "new"}, done: {from: ["ready"], to: "done"}};

/* the server when API is set; otherwise orders placed on this device (demo) */
function localApi(){
  const load = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch(e){ return []; } };
  const save = a => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(a)); } catch(e){} };
  return {
    async list(){ const t = Date.now(); return load().filter(o => !(o.status === "done" || o.status === "cancelled") || t - (o.updated || o.created) < 600000); },
    async act(id, action){
      const all = load(), o = all.find(x => x.id === id), step = NEXT[action];
      if (!o || !step.from.includes(o.status)) throw new Error("bad_transition");
      o.status = step.to; if (step.paid) o.paid = true; o.updated = Date.now(); save(all); return o;
    }
  };
}
function remoteApi(base){
  let token = ""; try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch(e){}
  const req = async (path, opt) => {
    let r;
    try { r = await fetch(base + path, Object.assign({cache: "no-store", headers: {"Content-Type": "application/json", "Authorization": token ? "Bearer " + token : ""}}, opt || {})); }
    catch(e){ throw Object.assign(new Error("net"), {code: "net"}); }
    const j = await r.json().catch(() => ({error: "other"}));
    if (!r.ok) throw Object.assign(new Error(j.error || "other"), {code: j.error || "other", status: r.status});
    return j;
  };
  return {
    hasToken: () => !!token,
    async login(pin){ const j = await req("/api/staff/login", {method: "POST", body: JSON.stringify({pin})}); token = j.token; try { localStorage.setItem(TOKEN_KEY, token); } catch(e){} },
    logout(){ token = ""; try { localStorage.removeItem(TOKEN_KEY); } catch(e){} },
    async list(){ return (await req("/api/staff/orders")).orders; },
    act: (id, action) => req(`/api/staff/orders/${encodeURIComponent(id)}/${action}`, {method: "POST", body: "{}"})
  };
}
const api = LIVE ? remoteApi(API) : localApi();
document.getElementById("demo").hidden = LIVE;

function card(o){
  return `
    <article class="ord ${o.status === "ready" ? "ready" : "new"}">
      <div class="top"><span class="no">#${o.no}</span><span class="tm">${hhmm(o.created)} · איסוף עצמי</span><span class="badge">${o.status === "ready" ? "מוכן · جاهز" : "בהכנה · عم يتحضّر"}</span></div>
      ${o.name || o.phone ? `<div class="who">${esc(o.name)}${o.phone ? ` · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ""}</div>` : ""}
      ${o.lines.map(x => `<div class="ln"><div class="nm"><span>${x.q}× ${esc(x.n[0])}</span><span>${x.p}₪</span></div>${x.o[0].map(v => `<div class="op">• ${esc(v)}</div>`).join("")}</div>`).join("")}
      ${o.note ? `<div class="note">הערה: ${esc(o.note)}</div>` : ""}
      <div class="tot"><span>סה״כ <small class="paid">שולם · مدفوع · ${esc(PAYN[o.pay] || o.pay)}</small></span><span>${o.total}₪</span></div>
      <div class="acts">${o.status === "ready"
        ? `<button type="button" class="dn" data-id="${esc(o.id)}" data-act="done">נאסף · استلم</button><button type="button" class="undo" data-id="${esc(o.id)}" data-act="reopen">↩</button>`
        : `<button type="button" class="rdy" data-id="${esc(o.id)}" data-act="ready">מוכן ✅ جاهز</button>`}</div>
    </article>`;
}
/* unpaid orders: only the number, the customer and the amount; the kitchen does not see them */
function waitCard(o){
  return `
    <article class="ord wait">
      <div class="top"><span class="no">#${o.no}</span><span class="tm">${hhmm(o.created)}</span><span class="badge wbadge">ממתין לתשלום · بانتظار الدفع</span></div>
      ${o.name || o.phone ? `<div class="who">${esc(o.name)}${o.phone ? ` · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ""}</div>` : ""}
      <div class="tot"><span>${esc(PAYN[o.pay] || "")} · ${o.lines.reduce((n, x) => n + x.q, 0)} פריטים</span><span>${o.total}₪</span></div>
      <div class="hint">בדקו בביט שהגיעו ${o.total}₪ מ${esc(o.name)} · شوفوا ببيت إنه وصلوا ${o.total}₪ من ${esc(o.name)}</div>
      <div class="acts"><button type="button" class="bitok" data-id="${esc(o.id)}" data-act="paid">התקבל ✓ · وصل</button><button type="button" class="cancel" data-id="${esc(o.id)}" data-act="cancel">ביטול · إلغاء</button></div>
    </article>`;
}
let orders = [], seen = null, actx = null, busy = false;
function draw(){
  const live = orders.filter(o => o.status !== "done" && o.status !== "cancelled");
  const waiting = live.filter(o => o.status === "awaiting_payment").sort((a, b) => a.no - b.no);
  const kitchen = live.filter(o => o.status === "new" || o.status === "ready").sort((a, b) => (a.status === "ready") - (b.status === "ready") || a.no - b.no);
  document.getElementById("cWait").textContent = waiting.length;
  document.getElementById("cPrep").textContent = kitchen.filter(o => o.status === "new").length;
  document.getElementById("cReady").textContent = kitchen.filter(o => o.status === "ready").length;
  document.getElementById("list").innerHTML =
    (waiting.length ? `<h2 class="sec wait-h">ממתין לתשלום · بانتظار الدفع <small>לא נשלח למטבח עד אישור התשלום · ما بيوصل للمطبخ قبل تأكيد الدفع</small></h2>` + waiting.map(waitCard).join("") : "") +
    `<h2 class="sec">מטבח · المطبخ</h2>` +
    (kitchen.length ? kitchen.map(card).join("") : `<div class="empty">אין הזמנות במטבח · ما في طلبات بالمطبخ</div>`);
}
async function refresh(){
  if (busy) return;
  try {
    const list = await api.list();
    document.getElementById("net").hidden = true;
    const fresh = seen ? list.filter(o => !seen.has(o.id + o.status) && (o.status === "awaiting_payment" || o.status === "new")) : [];
    seen = new Set(list.map(o => o.id + o.status));
    orders = list; draw();
    if (fresh.length) beep();
  } catch(e){
    if (e.code === "unauthorized") { api.logout(); showLogin(); return; }
    document.getElementById("net").hidden = false;
  }
}
document.getElementById("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  b.disabled = true; busy = true;
  try { const o = await api.act(b.dataset.id, b.dataset.act); orders = orders.map(x => x.id === o.id ? Object.assign({}, x, o) : x); seen && seen.add(o.id + o.status); draw(); }
  catch(err){ if (err.code === "unauthorized") { api.logout(); showLogin(); } }
  finally { busy = false; refresh(); }
});
document.getElementById("snd").addEventListener("click", e => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); e.currentTarget.classList.add("on"); beep(); } catch(err){}
});
function beep(){
  if (!actx) return;
  try { [0, .25, .5].forEach(off => { const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 660; g.gain.setValueAtTime(.0001, actx.currentTime + off);
    g.gain.exponentialRampToValueAtTime(.35, actx.currentTime + off + .02);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + off + .2);
    o.connect(g).connect(actx.destination); o.start(actx.currentTime + off); o.stop(actx.currentTime + off + .22); }); } catch(e){}
}

/* sign-in with the shop's PIN (only with the server) */
const loginForm = document.getElementById("login");
function showLogin(){ loginForm.hidden = false; document.getElementById("list").innerHTML = ""; setTimeout(() => document.getElementById("pin").focus(), 50); }
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("lerr"); err.textContent = "";
  try { await api.login(document.getElementById("pin").value); loginForm.hidden = true; document.getElementById("pin").value = ""; seen = null; refresh(); }
  catch(x){ err.textContent = x.code === "wrong_pin" ? "קוד שגוי · الكود غلط" : x.code === "rate_limited" ? "יותר מדי ניסיונות, נסו בעוד רבע שעה · محاولات كتير، جرّب بعد ربع ساعة" : "אין חיבור לשרת · ما في اتصال"; }
});
if (LIVE && !api.hasToken()) showLogin(); else refresh();
setInterval(() => { if (loginForm.hidden) refresh(); }, LIVE ? 4000 : 1500);
window.addEventListener("storage", e => { if (!LIVE && e.key === LOCAL_KEY) refresh(); });
</script>
</body>
</html>
