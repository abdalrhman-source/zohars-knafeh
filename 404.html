<title>הכנאפה של זוהר</title>
<script>
/* a mistyped address (capital letters, a missing slash, spaces) still reaches the right page */
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase().replace(/\s+/g, "");
  // the site lives at knafehzohar.com/ and, as before, at abdalrhman-source.github.io/zohars-knafeh/
  var base = /github\.io$/.test(location.hostname) ? "/zohars-knafeh/" : "/", to = base;
  if (p.indexOf("staff") > -1) to = base + "order/staff/";
  else if (p.indexOf("order") > -1) to = base + "order/";
  location.replace(to + location.search + location.hash);
})();
</script>
